# Loan Approval Client - Spring WS WebServiceTemplate Configuration
server.port=8080

# Application name
spring.application.name=loan-approval-client

# SOA Suite endpoint (WebServiceTemplate target)
soap.endpoint.loan-approval=http://localhost:8081/soap/LoanApprovalProcess

# Logging
logging.level.com.freddiemac.client=DEBUG
logging.level.org.springframework.ws=DEBUG

# WSDL validation is configured in SoapClientConfig.java
# Schema: loan-service-soa/LoanApprovalProcess.wsdl
